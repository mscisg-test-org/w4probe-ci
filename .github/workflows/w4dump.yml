name: w4dump
on:
  workflow_dispatch:
permissions:
  contents: write
  checks: write
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: CK-04 GITHUB_TOKEN creates a check run (checks:write)
        run: |
          echo "=== CK-04: GITHUB_TOKEN POST /check-runs ===" | tee -a dump.txt
          curl -sS -w '\nHTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            -d "{\"name\":\"w4-gh-token-checkrun\",\"head_sha\":\"${GITHUB_SHA}\",\"status\":\"completed\",\"conclusion\":\"success\",\"output\":{\"title\":\"gh-token\",\"summary\":\"CK-04\"}}" 2>&1 | tee -a dump.txt
      - name: CK-04b GITHUB_TOKEN posts a commit status (statuses:write)
        run: |
          echo "=== CK-04b: GITHUB_TOKEN POST /statuses ===" | tee -a dump.txt
          curl -sS -w '\nHTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"ci/gh-token","description":"gh token status"}' 2>&1 | tee -a dump.txt
      - name: WF-03 GITHUB_TOKEN pushes a NON-workflow file (contents:write control)
        run: |
          echo "=== WF-03-control: GITHUB_TOKEN push a normal file (contents:write) ===" | tee -a dump.txt
          git config user.name gh-actions; git config user.email actions@github.com
          echo "probe $(date +%s)" > gh-token-normal.txt
          git add gh-token-normal.txt && git commit -qm "WF-03 control normal file"
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin HEAD:main 2>&1 | tee -a dump.txt || echo "PUSH_RC=$?" | tee -a dump.txt
      - name: WF-03 GITHUB_TOKEN pushes a WORKFLOW-file change (no workflows permission)
        run: |
          echo "=== WF-03: GITHUB_TOKEN push a .github/workflows change (contents:write, NO workflows perm) ===" | tee -a dump.txt
          echo "# probe $(date +%s)" >> .github/workflows/w4dump.yml
          git add .github/workflows/w4dump.yml && git commit -qm "WF-03 workflow-file edit probe"
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin HEAD:main 2>&1 | tee -a dump.txt || echo "PUSH_RC=$?" | tee -a dump.txt
      - name: dump
        if: always()
        run: cat dump.txt >> "$GITHUB_STEP_SUMMARY"
